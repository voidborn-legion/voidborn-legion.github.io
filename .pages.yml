media:
  input: docs/public/images/uploads
  output: /images/uploads
  rename: safe
  categories: [image]

content:
  - name: guides
    label: Guides
    type: collection
    path: docs/guides
    format: yaml-frontmatter
    exclude: [index.md]
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Kurzbeschreibung
        type: text
      - name: author
        label: Autor
        type: string
      - name: updated
        label: Aktualisiert
        type: date
      - name: status
        label: Veröffentlichung
        type: select
        required: true
        description: Entwürfe fehlen auf der Website, sind aber im öffentlichen Repository sichtbar.
        options:
          values:
            - label: Entwurf (nicht auf der Website)
              name: draft
            - label: Veröffentlicht
              name: published
      - name: review
        label: Prüfstatus
        type: select
        required: true
        description: |
          **Markdown-Legende für den Inhalt**

          **Direkt im Editor:** In einer leeren Zeile `/` tippen → Bild (Image), Tabelle (Table), Überschrift, Liste oder Zitat auswählen.

          **Klappbox** – in „Source“ einfügen:

          ```md
          ::: details Titel der Klappbox

          Hier steht der ausklappbare Text.
          :::
          ```

          **Infobox** – in „Source“ einfügen:

          ```md
          ::: info Gut zu wissen

          Hier steht dein Hinweis.
          :::
          ```

          Statt `info` gehen auch `tip` (Tipp), `warning` (Warnung) und `danger` (wichtige Warnung).

          **Text und Links:** `**fett**` · `*kursiv*` · `[Linktext](https://beispiel.de)` · `[Pets-Guide](./pets)`

          Jede `:::`-Begrenzung steht in einer eigenen Zeile. Im CMS bleiben die Box-Markierungen sichtbar; auf der Website erscheinen die fertigen Boxen. Keine HTML-Tags `<details>` oder `<summary>` verwenden.
        options:
          values:
            - label: Guide folgt
              name: orientation
            - label: Website-Hilfe
              name: help
            - label: Inhalt noch prüfen
              name: pending
            - label: Geprüft
              name: verified
      - name: sources
        label: Quellen
        type: object
        list: true
        fields:
          - name: title
            label: Titel
            type: string
          - name: url
            label: Link
            type: string
      - name: body
        label: Inhalt
        type: rich-text
  - name: categories
    label: Themen
    type: file
    path: data/categories.json
    format: json
    list: true
    fields:
      - name: slug
        label: URL-Name
        type: string
        readonly: true
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Beschreibung
        type: text
      - name: group
        label: Bereich
        type: select
        options:
          values: [start, growth, combat, routine]
      - name: keywords
        label: Suchbegriffe
        type: string
      - name: icon
        label: Icon
        type: string
        readonly: true

settings:
  content:
    merge: true
