media:
  input: docs/public/images/uploads
  output: /images/uploads
  rename: safe
  categories: [image]

content:
  - name: guides
    label: Guides
    type: collection
    path: docs/guides
    format: yaml-frontmatter
    exclude: [index.md]
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Kurzbeschreibung
        type: text
      - name: author
        label: Autor
        type: string
      - name: updated
        label: Aktualisiert
        type: date
      - name: status
        label: Veröffentlichung
        type: select
        required: true
        description: Entwürfe fehlen auf der Website, sind aber im öffentlichen Repository sichtbar.
        options:
          values:
            - label: Entwurf (nicht auf der Website)
              name: draft
            - label: Veröffentlicht
              name: published
      - name: review
        label: Prüfstatus
        type: select
        required: true
        description: >-
          MARKDOWN-LEGENDE · ↵ bedeutet eine neue Zeile.
          MENÜ: In einer leeren Zeile / tippen → Bilder, Tabellen, Überschriften, Listen und Zitate.
          KLAPPBOX: ::: details Titel ↵ Inhalt ↵ :::
          INFOBOX: ::: info Titel ↵ Hinweistext ↵ :::
          VARIANTEN: tip = Tipp · warning = Warnung · danger = wichtige Warnung.
          TEXT: **fett** · *kursiv* · [Linktext](https://beispiel.de) · [Pets-Guide](./pets).
          Boxen in Source einfügen; jede :::-Begrenzung steht in einer eigenen Zeile.
          Im CMS sieht man die Markierungen, auf der Website die fertigen Boxen.
          Keine HTML-Tags details/summary verwenden.
        options:
          values:
            - label: Guide folgt
              name: orientation
            - label: Website-Hilfe
              name: help
            - label: Inhalt noch prüfen
              name: pending
            - label: Geprüft
              name: verified
      - name: sources
        label: Quellen
        type: object
        list: true
        fields:
          - name: title
            label: Titel
            type: string
          - name: url
            label: Link
            type: string
      - name: body
        label: Inhalt
        type: rich-text
  - name: categories
    label: Themen
    type: file
    path: data/categories.json
    format: json
    list: true
    fields:
      - name: slug
        label: URL-Name
        type: string
        readonly: true
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Beschreibung
        type: text
      - name: group
        label: Bereich
        type: select
        options:
          values: [start, growth, combat, routine]
      - name: keywords
        label: Suchbegriffe
        type: string
      - name: icon
        label: Icon
        type: string
        readonly: true

settings:
  content:
    merge: true
